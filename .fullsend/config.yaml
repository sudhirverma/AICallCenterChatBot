# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference

version: "1"
runtime: pi
roles:
  - triage
  - coder
  - review
  - fix
  - retro
  - prioritize
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
agents:
  - name: triage
    model: gateway/rits/zai-org/glm-5-3
    source: https://raw.githubusercontent.com/fullsend-ai/agents/62f25ace461b9c11a712bf5762f6e881892e4b74/harness/triage.yaml#sha256=bf4cd9cca1bb15d7849fbe236bc7c6f83db67c9005f8ec53ec929902c592416f
tracker:
  github:
    allowed_targets:
      repos:
        - sudhirverma/AICallCenterChatBot
        - fullsend-ai/fullsend
inference:
  gateway:
    url: https://api.enmaas.devshift.net
    auth: api-key
    # EnMaaS (Praxis) expects x-api-key, not Authorization: Bearer (ADR 0142).
    messages_auth_header: x-api-key
    models:
      rits/zai-org/glm-5-3:
        api: anthropic-messages